# Serves the built client (single-page app) and proxies /api and /health to the API container. "api" is resolved at
# request time through Docker's embedded DNS, so nginx starts before the API and survives the API being recreated.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
